name: crm-aluinter

services:
  db:
    container_name: crm-aluinter-db
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: crm-aluinter
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d crm-aluinter']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    image: pgvector/pgvector:pg16
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: crm-aluinter
      SEED_DEMO: ${SEED_DEMO:-1}
    volumes:
      - ./db/init:/sql/init:ro
      - ./supabase/migrations:/sql/migrations:ro
      - ./supabase/seed.sql:/sql/seed.sql:ro
      - ./scripts/docker-migrate.sh:/scripts/docker-migrate.sh:ro
    entrypoint: ['bash', '/scripts/docker-migrate.sh']
    restart: 'no'

  app:
    container_name: crm-aluinter
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3004}
        NEXT_PUBLIC_APP_LOCALE: ${NEXT_PUBLIC_APP_LOCALE:-pt}
        AUTH_SECRET: ${AUTH_SECRET:-crm-aluinter-local-dev-secret}
    env_file:
      - .env.docker.local
    environment:
      PORT: 3000
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/crm-aluinter
      AUTH_SECRET: ${AUTH_SECRET:-crm-aluinter-local-dev-secret}
      STORAGE_DIR: /tmp/crm-aluinter-storage
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - '3004:3000'
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000').then((r)=>process.exit(r.ok||r.status<500?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  pgdata:
    name: crm-aluinter-pgdata
